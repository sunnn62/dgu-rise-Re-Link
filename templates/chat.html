<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>익명 채팅 — Re:Link</title><link rel="stylesheet" href="/static/style.css?v=20260725-7"/></head>
<body class="chat-body">
  <main class="chat-shell">
    <header class="chat-header">
      <button class="button button-ghost button-icon" type="button" onclick="history.back()" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="chat-heading"><span class="chat-title">{% if role == 'finder' %}보호자와 채팅{% else %}발견자와 채팅{% endif %}</span><span id="connStatus" class="conn-status conn-connecting">연결 중…</span></div>
      <span class="anon-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>익명</span>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <div id="chatEmptyState" class="chat-empty-state"><svg class="chat-empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg><h1 class="chat-empty-state-title">아직 메시지가 없습니다</h1><p class="chat-empty-state-text">메시지는 비공개이며 역할로만 표시됩니다. 실명은 절대 공유되지 않습니다.</p></div>
    </section>

    <!-- [Week2/GAP B] 위치 공유 게이트: 발견자는 위치를 먼저 공유해야 채팅이 열린다.
         게이트 표시 여부는 서버가 접속 직후 보내는 gate 메시지(발견자 단위 잠금 상태)를 따른다. -->
    <section id="locationGate" class="location-gate" hidden>
      <div class="location-intro"><span class="location-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 19-9-9 19-2-8-8-2z"/></svg></span><div class="location-copy"><p class="location-title">위치를 한 번만 공유하기</p><p class="location-description">보호자가 찾아올 수 있도록 위치를 한 번만 공유하세요. 지속적인 위치 추적이 아닙니다.</p></div></div>
      <button id="shareLocationBtn" class="btn-location-primary" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>위치 공유하고 채팅 시작</button>
      <!-- [Week3] GPS/WiFi 오차가 큰 경우(실내 등) 장소를 직접 검색해 위치를 지정하는 대안.
           최소 기능 마크업(디자인 미완성) — "3주차_프론트 추가구현 요청.md" 참고. -->
      <button id="searchLocationToggleBtn" class="btn-text-link" type="button">GPS가 부정확하면 장소 직접 검색하기</button>
      <div id="locationSearchBox" hidden>
        <input id="locationSearchInput" class="input" type="text" placeholder="장소나 건물 이름을 검색하세요"/>
        <button id="locationSearchBtn" class="btn-emergency" type="button">검색</button>
        <ul id="locationSearchResults"></ul>
      </div>
      <button id="emergency112Btn" class="btn-emergency" type="button">위치 공유 없이 긴급 신고하기</button>
    </section>

    <section id="emergencyPanel" class="emergency-panel" hidden><div class="emergency-card"><p class="emergency-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.93.36 1.85.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.96.34 1.88.58 2.81.7A2 2 0 0 1 22 16.92z"/></svg>위치 공유 없이 신고하기</p><p class="emergency-panel-text">위치는 전송되지 않습니다. 119 또는 112에 전화해 도움이 필요한 사람을 발견했다고 알려 주세요.</p><a class="emergency-tel-link" href="tel:112"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.93.36 1.85.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.96.34 1.88.58 2.81.7A2 2 0 0 1 22 16.92z"/></svg>긴급 신고 전화</a><button id="backToLocationGateBtn" class="btn-text-link" type="button">뒤로</button></div></section>

    <form id="chatForm" class="chat-input-bar" autocomplete="off" hidden><div class="input-group"><textarea id="msgInput" class="msg-input" rows="1" maxlength="1000" placeholder="메시지를 입력하세요…" required></textarea><button class="btn-send" type="submit" aria-label="메시지 보내기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></div></form>
  </main>

  <script>window.CHAT_CONFIG = { roomId: {{ room_id|tojson }}, role: {{ role|tojson }}, wsUrl: {{ ws_url|tojson }} };</script>
  <script src="/static/chat.js?v=20260725-6"></script>
</body>
</html>
