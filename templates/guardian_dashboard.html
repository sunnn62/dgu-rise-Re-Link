<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보호자 대시보드 — Re:Link</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- [Week1] 세션 기반 대시보드. URL(/guardian/dashboard)에는 어떤 식별 정보도
       담기지 않으며, 접근 권한은 오직 로그인 세션 쿠키로만 판정된다.
       예전의 /guardian/{manage_token} 방식(URL에 토큰 노출)에서 전환됨. -->
  <header class="dashboard-header">
    <h1 class="dashboard-title">Re:Link 보호자 대시보드</h1>
    <p class="dashboard-subtitle">{{ guardian_name }}님, 안녕하세요</p>
    <form action="/logout" method="post" class="inline-form logout-form">
      <button type="submit" class="btn-logout">로그아웃</button>
    </form>
  </header>

  <main class="dashboard-main">
    <!-- 아이 목록 -->
    {% if children %}
    <section class="children-list">
      {% for child in children %}
      <div class="child-card">
        <div class="child-card-top">
          <span class="child-name">{{ child.name }}</span>
          <!-- [Week1] 소유권은 서버(main.py)가 child.guardian_id로 재검증한다.
               여기서는 로그인한 보호자 본인의 아이만 나열되므로 child_id만 넘긴다. -->
          <form action="/guardian/dashboard/children/{{ child.id }}/delete" method="post" class="inline-form">
            <button type="submit" class="btn-delete-icon" onclick="return confirm('정말 삭제하시겠습니까?')" aria-label="아이 삭제" title="삭제">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 0V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </form>
        </div>

        <div class="child-status-row">
          <span class="status-row-label">실종 신고</span>
          <!-- [GAP A] 이 토글이 Child.status를 normal<->missing으로 전환한다.
               missing일 때만 이 아이의 QR 스캔이 채팅으로 이어진다(서버가 재검증). -->
          <form action="/guardian/dashboard/children/{{ child.id }}/toggle" method="post" class="inline-form toggle-form">
            <button type="submit" class="toggle-switch {% if child.status == 'missing' %}is-on{% endif %}" aria-pressed="{% if child.status == 'missing' %}true{% else %}false{% endif %}">
              <span class="toggle-switch-label-off">OFF</span>
              <span class="toggle-knob"></span>
              <span class="toggle-switch-label-on">ON</span>
            </button>
          </form>
        </div>

        {% if child.active_room_id %}
        <!-- [Week1] 진행 중인 채팅방 표시. 이 아이가 실종 신고된 뒤 발견자가
             채팅을 시작하면 여기 노출된다(PLAN "진행 중인 채팅방 접근").
             입장 시 서버가 다시 한 번 소유권(child.guardian_id == 로그인 세션)을
             재검증한다(GAP B). -->
        <a href="/chat/{{ child.active_room_id }}?role=guardian" class="btn-active-room">
          💬 진행 중인 채팅방 입장
        </a>
        {% endif %}

        <a href="/admin/children/{{ child.qr_token }}/qr" class="btn-qr-prominent" download>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><line x1="14" y1="14" x2="14" y2="21"></line><line x1="21" y1="14" x2="21" y2="21"></line><line x1="14" y1="17.5" x2="21" y2="17.5"></line></svg>
          <span>QR 코드 다운로드</span>
        </a>
      </div>
      {% endfor %}
    </section>
    {% else %}
    <div class="empty-state">
      <p class="empty-icon">👶</p>
      <p class="empty-text">등록된 아이가 없습니다</p>
      <p class="empty-sub">아래에서 아이를 추가해 주세요.</p>
    </div>
    {% endif %}

    <!-- 아이 추가 폼: 시리얼 번호로 사전 발급된 QR을 이 계정에 연결(claim)한다. -->
    <section class="add-child-section">
      <h2 class="section-title">아이 추가</h2>
      <form class="add-child-form" action="/guardian/dashboard/children" method="post">
        <input
          name="child_name"
          class="form-input add-child-input"
          type="text"
          placeholder="아이 이름을 입력하세요"
          required
          maxlength="100"
        />
        <input
          name="serial"
          class="form-input add-child-input"
          type="text"
          placeholder="QR 스티커 시리얼 번호 (예: RL-AB2C-9KMP)"
          required
          maxlength="32"
        />
        <button type="submit" class="btn-primary btn-add">+ 아이 추가하기</button>
      </form>
    </section>
  </main>
</body>
</html>
