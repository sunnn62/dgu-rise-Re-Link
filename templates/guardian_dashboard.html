<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보호자 관리 — Re:Link</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="dashboard-header">
    <h1 class="dashboard-title">Re:Link 보호자 관리</h1>
    <p class="dashboard-subtitle">{{ guardian_name }}님, 안녕하세요</p>
  </header>

  <main class="dashboard-main">
    <!-- 아이 목록 -->
    {% if children %}
    <section class="children-list">
      {% for child in children %}
      <div class="child-card">
        <div class="child-card-top">
          <span class="child-name">{{ child.name }}</span>
          <form action="/guardian/{{ manage_token }}/children/{{ child.id }}/delete" method="post" class="inline-form">
            <button type="submit" class="btn-delete-icon" onclick="return confirm('정말 삭제하시겠습니까?')" aria-label="아이 삭제" title="삭제">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 0V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </form>
        </div>

        <div class="child-status-row">
          <span class="status-row-label">실종 신고</span>
          <form action="/guardian/{{ manage_token }}/children/{{ child.id }}/toggle" method="post" class="inline-form toggle-form">
            <button type="submit" class="toggle-switch {% if child.status == 'missing' %}is-on{% endif %}" aria-pressed="{% if child.status == 'missing' %}true{% else %}false{% endif %}">
              <span class="toggle-switch-label-off">OFF</span>
              <span class="toggle-knob"></span>
              <span class="toggle-switch-label-on">ON</span>
            </button>
          </form>
        </div>

        <a href="/admin/children/{{ child.qr_token }}/qr" class="btn-qr-prominent" download>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><line x1="14" y1="14" x2="14" y2="21"></line><line x1="21" y1="14" x2="21" y2="21"></line><line x1="14" y1="17.5" x2="21" y2="17.5"></line></svg>
          <span>QR 코드 다운로드</span>
        </a>
      </div>
      {% endfor %}
    </section>
    {% else %}
    <div class="empty-state">
      <p class="empty-icon">👶</p>
      <p class="empty-text">등록된 아이가 없습니다</p>
      <p class="empty-sub">아래에서 아이를 추가해 주세요.</p>
    </div>
    {% endif %}

    <!-- 아이 추가 폼 -->
    <section class="add-child-section">
      <h2 class="section-title">아이 추가</h2>
      <form class="add-child-form" action="/guardian/{{ manage_token }}/children" method="post">
        <input
          name="child_name"
          class="form-input add-child-input"
          type="text"
          placeholder="아이 이름을 입력하세요"
          required
          maxlength="100"
        />
        <button type="submit" class="btn-primary btn-add">+ 아이 추가하기</button>
      </form>
    </section>
  </main>
</body>
</html>
